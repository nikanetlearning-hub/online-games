<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آموزش حروف فارسی</title>
<style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden}
    body{
        background:#0a0a0a;color:#fff;
        font-family:'B Nazanin','Tahoma','Vazirmatn',sans-serif;
        display:flex;justify-content:center;align-items:center;
        height:100vh;direction:rtl;
        cursor:pointer;
        touch-action:manipulation;
        -webkit-tap-highlight-color:transparent;
    }

    /* ===== هایلایت رنگ هر حرف ===== */
    ::highlight(cc0)  { color:#ff6b6b; }
    ::highlight(cc1)  { color:#feca57; }
    ::highlight(cc2)  { color:#48dbfb; }
    ::highlight(cc3)  { color:#ff9ff3; }
    ::highlight(cc4)  { color:#54a0ff; }
    ::highlight(cc5)  { color:#a29bfe; }
    ::highlight(cc6)  { color:#00d2d3; }
    ::highlight(cc7)  { color:#1dd1a1; }
    ::highlight(cc8)  { color:#ff9f43; }
    ::highlight(cc9)  { color:#f368e0; }
    ::highlight(cc10) { color:#ee5a24; }
    ::highlight(cc11) { color:#c8d6e5; }
    ::highlight(cc12) { color:#7bed9f; }
    ::highlight(cc13) { color:#eccc68; }
    ::highlight(cc14) { color:#70a1ff; }
    ::highlight(cc15) { color:#ff7f50; }
    ::highlight(cc16) { color:#32ff7e; }
    ::highlight(cc17) { color:#18dcff; }
    ::highlight(cc18) { color:#cd84f1; }
    ::highlight(cc19) { color:#ffb8b8; }
    ::highlight(found) {
        background-color:#facc15;
        color:#1e293b;
        text-decoration:underline;
        text-decoration-thickness:clamp(3px,.5vw,6px);
        text-decoration-color:#22c55e;
    }
    ::highlight(wrongflash) {
        background-color:#ef4444;
        color:#fff;
    }

    /* ===== مودال نام ===== */
    .name-modal{
        position:fixed;inset:0;background:#0a0a0a;
        display:flex;flex-direction:column;justify-content:center;align-items:center;
        z-index:100;padding:20px;gap:20px;
    }
    .name-modal h1{font-size:clamp(22px,4vw,40px);color:#ffd700;text-align:center}
    .name-modal input{
        width:min(320px,80vw);padding:14px 18px;border-radius:12px;
        border:2px solid #334155;background:#1e293b;color:#fff;
        font-size:clamp(16px,2.5vw,24px);font-family:inherit;text-align:center;outline:none;
    }
    .name-modal input:focus{border-color:#ffd700}
    .name-modal button{
        background:#22c55e;color:#fff;border:none;
        padding:14px 40px;border-radius:12px;
        font-size:clamp(16px,2.5vw,26px);font-family:inherit;font-weight:bold;
        cursor:pointer;transition:transform .2s,background .2s;
    }
    .name-modal button:hover{background:#16a34a;transform:scale(1.05)}
    .name-modal button:disabled{background:#475569;cursor:not-allowed;transform:none}

    /* ===== نوار بالا ===== */
    .topbar{
        position:fixed;top:0;right:0;left:0;
        min-height:clamp(44px,5.5vh,60px);
        background:rgba(255,255,255,.08);
        backdrop-filter:blur(6px);
        display:flex;align-items:center;justify-content:space-between;
        padding:6px clamp(10px,2vw,24px);
        font-size:clamp(12px,1.3vw,17px);
        z-index:50;gap:8px;flex-wrap:wrap;
        border-bottom:1px solid rgba(255,255,255,.05);
    }
    .topbar .info{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
    .topbar .info span{color:#94a3b8}
    .topbar .info b{color:#ffd700}
    .topbar .actions{display:flex;gap:8px;flex-wrap:wrap}
    .topbar button{
        background:#ffd700;color:#000;border:none;
        padding:clamp(5px,.7vw,9px) clamp(10px,1.3vw,16px);
        border-radius:8px;font-size:clamp(11px,1.2vw,16px);
        font-family:inherit;font-weight:bold;cursor:pointer;
        transition:background .2s;white-space:nowrap;
    }
    .topbar button:hover{background:#fff}
    .topbar button.back{background:#ef4444;color:#fff}
    .topbar button.back:hover{background:#dc2626}
    .topbar button.active{background:#22c55e;color:#fff}

    /* ===== بنر راهنما ===== */
    .hint-banner{
        position:fixed;top:clamp(44px,5.5vh,60px);right:0;left:0;
        height:clamp(100px,18vh,200px);
        background:linear-gradient(135deg,#facc15,#f59e0b,#facc15);
        border-bottom:clamp(3px,.5vw,6px) solid #fff;
        display:none;justify-content:center;align-items:center;
        gap:clamp(12px,3vw,36px);
        z-index:45;box-shadow:0 6px 30px rgba(250,204,21,.5);
    }
    .hint-banner.show{display:flex}
    .hint-banner .lbl{font-size:clamp(16px,3vw,36px);color:#1e293b;font-weight:bold}
    .hint-banner .chr{
        font-size:clamp(64px,15vw,170px);font-weight:bold;color:#1e293b;line-height:1;
        min-width:clamp(64px,13vw,170px);text-align:center;
    }

    /* ===== ناحیه بازی ===== */
    .game{
        display:flex;flex-direction:column;justify-content:center;align-items:center;
        gap:clamp(14px,3vh,36px);
        transition:transform .3s ease;padding:0 clamp(10px,3vw,40px);
        text-align:center;width:100%;
    }
    .game.shifted{transform:translateY(clamp(44px,7vh,90px))}
    .instruction{font-size:clamp(13px,2vw,24px);color:#94a3b8}

    /* ===== نمایش کلمه پیوسته ===== */
    .word{
        direction:rtl;
        unicode-bidi:isolate;
        font-family:'B Nazanin','Tahoma','Vazirmatn',sans-serif;
        font-size:clamp(70px,13vw,190px);
        font-weight:bold;
        color:#f8fafc;
        line-height:1.5;
        padding:clamp(8px,1.5vw,24px) clamp(14px,2.5vw,36px);
        cursor:pointer;
        user-select:none;
        white-space:nowrap;
        letter-spacing:0;
        text-align:center;
        transition:transform .2s ease;
        touch-action:manipulation;
    }
    .word.long{font-size:clamp(48px,9vw,130px)}
    .word.pop{animation:pop .55s ease}
    @keyframes pop{
        0%{transform:scale(1)}
        45%{transform:scale(1.1)}
        100%{transform:scale(1)}
    }
    .word.shake{animation:shake .4s ease}
    @keyframes shake{
        0%,100%{transform:translateX(0)}
        25%{transform:translateX(-10px)}
        75%{transform:translateX(10px)}
    }

    /* ===== پنل بازخورد ===== */
    .feedback-panel{
        display:none;
        flex-direction:column;
        align-items:center;
        gap:clamp(10px,1.5vh,16px);
        width:100%;
        max-width:720px;
        padding:0 clamp(8px,2vw,20px);
    }
    .feedback-panel.show{
        display:flex;
        animation:fadeInUp .35s ease;
    }
    @keyframes fadeInUp{
        from{opacity:0;transform:translateY(15px)}
        to{opacity:1;transform:translateY(0)}
    }

    .feedback-text{
        width:100%;
        padding:clamp(10px,1.5vw,18px) clamp(16px,2.5vw,30px);
        border-radius:14px;
        font-size:clamp(15px,2.2vw,26px);
        font-weight:bold;
        text-align:center;
        line-height:1.55;
    }
    .feedback-panel.success .feedback-text{
        color:#fff;
        background:linear-gradient(135deg,rgba(34,197,94,.92),rgba(22,163,74,.92));
        border:2px solid #22c55e;
        box-shadow:0 0 30px rgba(34,197,94,.35);
    }
    .feedback-panel.wrong .feedback-text{
        color:#fff;
        background:linear-gradient(135deg,rgba(251,146,60,.92),rgba(249,115,22,.92));
        border:2px solid #fbbf24;
        box-shadow:0 0 30px rgba(251,146,60,.35);
    }
    .feedback-edu{
        font-size:.85em;
        color:#fef3c7;
        margin-bottom:6px;
    }
    .feedback-encourage{
        font-size:1em;
        color:#fff;
    }

    .feedback-buttons{
        display:flex;
        gap:clamp(8px,1.5vw,16px);
        flex-wrap:wrap;
        justify-content:center;
    }
    .feedback-panel.wrong .feedback-buttons{ display:none; }

    /* ===== دکمه‌های عملیات ===== */
    .action-btn{
        background:#22c55e;color:#fff;border:none;
        padding:clamp(11px,1.4vw,16px) clamp(24px,3.5vw,44px);
        border-radius:14px;
        font-size:clamp(15px,2vw,24px);
        font-family:inherit;font-weight:bold;cursor:pointer;
        box-shadow:0 4px 20px rgba(34,197,94,.4);
        transition:transform .2s,background .2s;
        white-space:nowrap;
    }
    .action-btn:hover{background:#16a34a;transform:scale(1.05)}
    .action-btn.gold{
        background:linear-gradient(135deg,#facc15,#f59e0b);
        color:#1e293b;
        box-shadow:0 4px 20px rgba(250,204,21,.5);
    }
    .action-btn.gold:hover{background:linear-gradient(135deg,#fbbf24,#d97706)}

    /* ===== پاداش ===== */
    .reward{
        position:fixed;inset:0;background:rgba(0,0,0,.94);
        display:none;flex-direction:column;justify-content:center;align-items:center;
        z-index:70;gap:clamp(12px,2vh,22px);padding:20px;
    }
    .reward img{
        max-width:85vw;max-height:55vh;
        border-radius:clamp(10px,1.5vw,20px);
        border:clamp(2px,.5vw,5px) solid #ffd700;
        box-shadow:0 0 50px rgba(255,215,0,.6);
        object-fit:cover;display:none;
    }
    .reward .txt{
        font-size:clamp(18px,3vw,34px);color:#ffd700;
        text-shadow:0 0 10px #000;text-align:center;padding:0 12px;
        font-weight:bold;
    }
    .reward .loading{
        font-size:clamp(16px,2.5vw,28px);
        color:#94a3b8;text-align:center;
    }

    /* ===== مودال انتخاب حرف ===== */
    .selector{
        position:fixed;inset:0;background:#0a0a0a;
        display:none;flex-direction:column;justify-content:center;align-items:center;
        z-index:60;padding:clamp(8px,2vw,28px);overflow-y:auto;gap:8px;
    }
    .selector h2{font-size:clamp(15px,2.5vw,28px);text-align:center;margin-bottom:4px}
    .selector h3{font-size:clamp(12px,1.8vw,20px);color:#ffd700;margin-top:10px;margin-bottom:4px}

    .letter-grid{
        display:grid;
        grid-template-columns:repeat(auto-fill,minmax(clamp(44px,5.5vw,80px),1fr));
        gap:clamp(5px,.8vw,12px);
        max-height:32vh;width:100%;max-width:1000px;
        overflow-y:auto;padding:8px;justify-items:center;
    }
    .letter-grid .ltr{
        font-size:clamp(24px,3.5vw,50px);
        padding:clamp(5px,1vw,12px);
        border:2px solid #475569;border-radius:10px;
        width:100%;text-align:center;cursor:pointer;
        transition:all .2s;user-select:none;
    }
    .letter-grid .ltr:hover{border-color:#ffd700;background:rgba(255,215,0,.1)}
    .letter-grid .ltr.sel{background:#22c55e;border-color:#22c55e;color:#fff}

    .form-list{display:flex;flex-wrap:wrap;gap:clamp(5px,.8vw,12px);justify-content:center;max-width:900px;margin-bottom:8px}
    .form-list button{
        background:transparent;color:#fff;border:2px solid #64748b;
        padding:clamp(5px,1vw,11px) clamp(12px,1.8vw,22px);
        border-radius:10px;font-size:clamp(12px,1.6vw,19px);
        font-family:inherit;cursor:pointer;transition:all .2s;
    }
    .form-list button:hover{border-color:#ffd700}
    .form-list button.sel{background:#ffd700;border-color:#ffd700;color:#000;font-weight:bold}

    .start-btn{
        background:#22c55e;color:#fff;border:none;
        padding:clamp(9px,1.4vw,15px) clamp(28px,4.5vw,56px);
        border-radius:12px;font-size:clamp(15px,2.3vw,26px);
        font-family:inherit;font-weight:bold;cursor:pointer;
        margin-top:12px;box-shadow:0 4px 18px rgba(34,197,94,.4);
        transition:transform .2s,background .2s;
    }
    .start-btn:hover{background:#16a34a;transform:scale(1.05)}
    .start-btn:disabled{background:#475569;cursor:not-allowed;transform:none;box-shadow:none}

    @media(min-width:1920px){
        .word{font-size:210px}
        .word.long{font-size:150px}
    }
    @media(max-width:480px){
        .topbar{padding:5px 8px}
        .topbar button{padding:5px 8px;font-size:11px}
        .letter-grid{grid-template-columns:repeat(5,1fr)}
    }
</style>
</head>
<body>

<!-- مودال نام -->
<div class="name-modal" id="nameModal">
    <h1>سلام! اسمت چیه؟</h1>
    <input type="text" id="nameInput" placeholder="اسمت رو بنویس..." maxlength="20" autofocus>
    <button id="nameBtn" disabled>شروع یادگیری 🚀</button>
</div>

<!-- نوار بالا -->
<div class="topbar" id="topbar" style="display:none">
    <div class="info">
        <span>👤 <b id="userNameDisplay">—</b></span>
        <span>حرف: <b id="letterDisplay">—</b></span>
        <span>شکل: <b id="formDisplay">—</b></span>
        <span>⭐ <b id="scoreDisplay">0</b></span>
    </div>
    <div class="actions">
        <button id="hintBtn" class="active">نمایش راهنما</button>
        <button id="changeBtn">تغییر حرف / شکل</button>
        <button id="backBtn" class="back">🏠 بازگشت</button>
    </div>
</div>

<!-- بنر راهنما -->
<div class="hint-banner" id="hintBanner">
    <span class="lbl">شکل مورد نظر:</span>
    <span class="chr" id="hintChr">—</span>
</div>

<!-- ناحیه بازی -->
<div class="game" id="gameArea" style="display:none">
    <p class="instruction" id="instructionText">حرف مورد نظر را در کلمه پیدا کن و روی آن کلیک کن</p>
    <div class="word" id="wordDisplay"></div>
    <div class="feedback-panel" id="feedbackPanel">
        <div class="feedback-text" id="feedbackText"></div>
        <div class="feedback-buttons" id="feedbackButtons">
            <button class="action-btn gold" id="showRewardBtn">🎁 نمایش پاداش</button>
            <button class="action-btn" id="nextWordBtnFeedback">کلمه بعدی ➜</button>
        </div>
    </div>
</div>

<!-- پاداش -->
<div class="reward" id="rewardOverlay">
    <div class="loading" id="rewardLoading">⏳ در حال بارگذاری جایزه...</div>
    <img id="rewardImg" src="" alt="جایزه">
    <div class="txt" id="rewardTxt"></div>
    <button class="action-btn" id="nextWordBtnReward">کلمه‌ی بعدی ➜</button>
</div>

<!-- مودال انتخاب -->
<div class="selector" id="selector">
    <h2>انتخاب حرف و شکل برای آموزش</h2>
    <h3>۱) حرف را انتخاب کنید:</h3>
    <div class="letter-grid" id="letterGrid"></div>
    <h3>۲) شکل حرف را انتخاب کنید:</h3>
    <div class="form-list" id="formList"></div>
    <button class="start-btn" id="startBtn" disabled>شروع بازی</button>
</div>

<script>
/* ================================================================
   دیتابیس کامل حروف فارسی
   ================================================================ */
const DB = {
  'ا':{display:'ا / آ',forms:[
    {v:'آ-اول',l:'آ در اول (آب...)'},
    {v:'ا-اول',l:'ا در اول (اتاق...)'},
    {v:'ا-وسط',l:'ا در وسط (باران...)'},
    {v:'ا-آخر',l:'ا در آخر (بابا...)'}
  ],words:{
    'آ-اول':[
      {w:'آسمان',i:0},{w:'آفتاب',i:0},{w:'آبادان',i:0},{w:'آشکار',i:0},
      {w:'آرام',i:0},{w:'آبشار',i:0},{w:'آشتی',i:0},{w:'آلبالو',i:0},
      {w:'آموزگار',i:0},{w:'آینه',i:0},{w:'آتش',i:0},{w:'آشپز',i:0},
      {w:'آباد',i:0},{w:'آزاد',i:0},{w:'آسان',i:0},{w:'آهسته',i:0},
      {w:'آجر',i:0},{w:'آخر',i:0},{w:'آدم',i:0},{w:'آرزو',i:0}
    ],
    'ا-اول':[
      {w:'اتاق',i:0},{w:'انار',i:0},{w:'اساس',i:0},{w:'ارسال',i:0},
      {w:'افتخار',i:0},{w:'استکان',i:0},{w:'استاد',i:0},{w:'امسال',i:0},
      {w:'ایستگاه',i:0},{w:'اشتها',i:0},{w:'الماس',i:0},{w:'اکبر',i:0},
      {w:'امیر',i:0},{w:'افسانه',i:0},{w:'انگور',i:0},{w:'امروز',i:0},
      {w:'ایران',i:0},{w:'ادب',i:0},{w:'ارمغان',i:0},{w:'اسبی',i:0}
    ],
    'ا-وسط':[
      {w:'باران',i:1},{w:'بادام',i:1},{w:'کاروان',i:1},{w:'بازار',i:1},
      {w:'شکار',i:2},{w:'بهار',i:2},{w:'مادر',i:1},{w:'نگار',i:2},
      {w:'ماهور',i:1},{w:'قمار',i:2},{w:'کبوتر',i:2},{w:'نماز',i:2},
      {w:'سارا',i:1},{w:'تارا',i:1},{w:'آزاد',i:1},{w:'کار',i:1},
      {w:'دارو',i:1},{w:'دکان',i:1},{w:'سماور',i:2}
    ],
    'ا-آخر':[
      {w:'بابا',i:3},{w:'دانا',i:3},{w:'دریا',i:3},{w:'زیبا',i:3},
      {w:'صدا',i:2},{w:'خدا',i:2},{w:'تنها',i:3},{w:'آشنا',i:3},
      {w:'دنیا',i:3},{w:'نما',i:2},{w:'روا',i:2},{w:'شکلا',i:3},
      {w:'امضا',i:3},{w:'فرما',i:3},{w:'گدا',i:2}
    ]
  }},
  'ب':{display:'ب',forms:[
    {v:'اول',l:'ب اول (بـ)'},{v:'وسط',l:'ب وسط (ـبـ)'},{v:'آخر',l:'ب آخر (ـب)'}
  ],words:{
    'اول':[
      {w:'باران',i:0},{w:'باغ',i:0},{w:'بازار',i:0},{w:'بچه',i:0},
      {w:'برادر',i:0},{w:'بستنی',i:0},{w:'بلبل',i:0},{w:'بهار',i:0},
      {w:'بادام',i:0},{w:'بابا',i:0},{w:'برف',i:0},{w:'بینی',i:0},
      {w:'بیابان',i:0},{w:'بهانه',i:0},{w:'بخار',i:0},{w:'برنج',i:0},
      {w:'بزرگ',i:0},{w:'بیمار',i:0},{w:'بیست',i:0},{w:'بازی',i:0}
    ],
    'وسط':[
      {w:'آبادی',i:1},{w:'کبوتر',i:1},{w:'ببر',i:1},{w:'آبی',i:1},
      {w:'دربار',i:2},{w:'سبد',i:1},{w:'صبور',i:1},{w:'آبشار',i:1},
      {w:'لباس',i:1},{w:'کباب',i:1},{w:'خبر',i:1},{w:'شبانه',i:1},
      {w:'بابونه',i:1},{w:'سبزه',i:1},{w:'درباره',i:2}
    ],
    'آخر':[
      {w:'کتاب',i:3},{w:'آب',i:1},{w:'شب',i:1},{w:'قلب',i:3},
      {w:'اسب',i:2},{w:'کباب',i:3},{w:'غروب',i:3},{w:'مطلب',i:3},
      {w:'طلب',i:2},{w:'ادب',i:2},{w:'لب',i:1},{w:'باب',i:2},
      {w:'خوب',i:3},{w:'چوب',i:3}
    ]
  }},
  'پ':{display:'پ',forms:[
    {v:'اول',l:'پ اول (پـ)'},{v:'وسط',l:'پ وسط (ـپـ)'},{v:'آخر',l:'پ آخر (ـپ)'}
  ],words:{
    'اول':[
      {w:'پروانه',i:0},{w:'پدر',i:0},{w:'پنجره',i:0},{w:'پسته',i:0},
      {w:'پاییز',i:0},{w:'پرنده',i:0},{w:'پنیر',i:0},{w:'پول',i:0},
      {w:'پسر',i:0},{w:'پل',i:0},{w:'پتو',i:0},{w:'پاکت',i:0},
      {w:'پزشک',i:0},{w:'پلیس',i:0},{w:'پارک',i:0},{w:'پرچم',i:0},
      {w:'پاستیل',i:0},{w:'پیام',i:0},{w:'پرواز',i:0},{w:'پنج',i:0},
      {w:'پنجشنبه',i:0},{w:'پیراهن',i:0},{w:'پشه',i:0}
    ],
    'وسط':[
      {w:'سپید',i:1},{w:'سپر',i:1},{w:'کپک',i:1},{w:'لپه',i:1},

];
const ENCOURAGES = [
  'دوباره تلاش کن! 💪','تو میتونی! 🌟','نزدیک بود! ✨',
  'با دقت بیشتر! 🎯','نگران نباش، دوباره امتحان کن! 🌈',
  'شجاع باش و دوباره بگرد! 🔍','خودت رو باور کن! 💫'

/* ================================================================
   نام کاربر
   ================================================================ */
nameInput.addEventListener('input',()=>{
  nameBtn.disabled = nameInput.value.trim().length === 0;
});
nameInput.addEventListener('keydown',e=>{
  if(e.key === 'Enter' && !nameBtn.disabled) nameBtn.click();
});
nameBtn.addEventListener('click',()=>{
  const n = nameInput.value.trim();
  if(!n) return;
  state.userName = n;
  userNameDisp.textContent = n;
  nameModal.style.display = 'none';
  topbar.style.display = 'flex';
  selector.style.display = 'flex';
  buildLetterGrid();
});

/* ================================================================
   انتخاب حرف و شکل
   ================================================================ */
function buildLetterGrid(){
  letterGrid.innerHTML = '';
  Object.keys(DB).forEach(key=>{
    const d = document.createElement('div');
    d.className = 'ltr';
    d.textContent = DB[key].display;
    d.dataset.key = key;
    d.addEventListener('click',()=>selectLetter(key));
    letterGrid.appendChild(d);
  });
}
function selectLetter(key){
  state.letter = key;
  state.form = '';
  letterGrid.querySelectorAll('.ltr').forEach(el=>{
    el.classList.toggle('sel', el.dataset.key === key);
  });
  buildFormList(key);
  startBtn.disabled = true;
}
function buildFormList(key){
  formList.innerHTML = '';
  DB[key].forms.forEach(f=>{
    const b = document.createElement('button');
    b.textContent = f.l;
    b.dataset.v = f.v;
    b.addEventListener('click',()=>{
      state.form = f.v;
      formList.querySelectorAll('button').forEach(x=>{
        x.classList.toggle('sel', x.dataset.v === f.v);
      });
      startBtn.disabled = false;
    });
    formList.appendChild(b);
  });
}

/* ================================================================
   شروع بازی
   ================================================================ */
startBtn.addEventListener('click',()=>{
  if(!state.letter || !state.form) return;
  state.score = 0;
  state.usedWords = [];
  state.isLocked = false;
  state.hintVisible = false;
  scoreDisp.textContent = '0';
  letterDisp.textContent = DB[state.letter].display;
  formDisp.textContent = state.form;
  selector.style.display = 'none';
  gameArea.style.display = 'flex';
  hintBanner.classList.remove('show');
  hintBtn.textContent = 'نمایش راهنما';
  hintBtn.classList.add('active');
  gameArea.classList.remove('shifted');
  hideFeedback();
  showNextWord();
});

/* ================================================================
   نمایش کلمه بعدی
   ================================================================ */
function showNextWord(){
  state.isLocked = false;
  clearTimeout(state.feedbackTimer);
  hideFeedback();
  rewardOverlay.style.display = 'none';
  rewardImg.style.display = 'none';
  rewardLoading.style.display = 'block';
  rewardLoading.textContent = '⏳ در حال بارگذاری جایزه...';
  rewardTxt.textContent = '';
  wordDisplay.classList.remove('pop','shake');

  if(HAS_HIGHLIGHT) CSS.highlights.clear();

  const pool = DB[state.letter].words[state.form];
  if(!pool || pool.length === 0){
    instruction.textContent = 'کلمه‌ای ثبت نشده است.';
    wordDisplay.textContent = '';
    return;
  }
  let avail = pool.filter(w=>!state.usedWords.includes(w.w));
  if(avail.length === 0){ state.usedWords = []; avail = pool; }
  const pick = avail[Math.floor(Math.random() * avail.length)];
  state.usedWords.push(pick.w);
  state.wordData = pick;

  instruction.textContent = `حرف «${DB[state.letter].display}» را در کلمه پیدا کن و روی آن کلیک کن`;
  renderWord(pick.w);
}

/* ================================================================
   رندر کلمه پیوسته با رنگ متفاوت برای هر حرف
   ================================================================ */
function renderWord(word){
  wordDisplay.classList.remove('long');
  if(word.length > 6) wordDisplay.classList.add('long');
  wordDisplay.textContent = word;

  if(!HAS_HIGHLIGHT) return;

  const textNode = wordDisplay.firstChild;
  if(!textNode || textNode.nodeType !== Node.TEXT_NODE) return;

  for(let i = 0; i < word.length; i++){
    const range = document.createRange();
    range.setStart(textNode, i);
    range.setEnd(textNode, i + 1);
    const h = new Highlight(range);
    CSS.highlights.set('cc' + i, h);
  }
}

/* ================================================================
   تشخیص کاراکتر کلیک‌شده
   ================================================================ */
function getClickedCharIndex(event){
  const textNode = wordDisplay.firstChild;
  if(!textNode || textNode.nodeType !== Node.TEXT_NODE) return -1;
  const text = textNode.textContent;

  if(document.caretPositionFromPoint){
    const pos = document.caretPositionFromPoint(event.clientX, event.clientY);
    if(pos && pos.offsetNode === textNode){
      const off = pos.offset;
      for(const cand of [off, off - 1]){
        if(cand >= 0 && cand < text.length){
          const r = document.createRange();
          r.setStart(textNode, cand);
          r.setEnd(textNode, cand + 1);
          const rect = r.getBoundingClientRect();
          if(event.clientX >= rect.left - 2 && event.clientX <= rect.right + 2 &&
             event.clientY >= rect.top - 2 && event.clientY <= rect.bottom + 2){
            return cand;
          }
        }
      }
    }
  }

  for(let i = 0; i < text.length; i++){
    const range = document.createRange();
    range.setStart(textNode, i);
    range.setEnd(textNode, i + 1);
    const rect = range.getBoundingClientRect();
    if(rect.width > 0 && rect.height > 0 &&
       event.clientX >= rect.left && event.clientX <= rect.right &&
       event.clientY >= rect.top && event.clientY <= rect.bottom){
      return i;
    }
  }
  return -1;
}

/* ================================================================
   کلیک روی کلمه
   ================================================================ */
wordDisplay.addEventListener('click',(event)=>{
  if(state.isLocked || !state.wordData) return;
  const idx = getClickedCharIndex(event);
  if(idx === -1) return;

  if(idx === state.wordData.i){
    onCorrectAnswer(idx);
  } else {
    onWrongAnswer(idx);
  }
});

/* ================================================================
   پاسخ درست
   ================================================================ */
function onCorrectAnswer(idx){
  state.isLocked = true;
  state.score++;
  scoreDisp.textContent = state.score;

  highlightFound(idx);
  wordDisplay.classList.add('pop');
  instruction.textContent = 'آفرین! می‌خوای جایزه ببینی یا کلمه بعدی؟';

  showSuccessFeedback();
}

/* ================================================================
   پاسخ نادرست
   ================================================================ */
function onWrongAnswer(idx){
  flashWrong(idx);
  wordDisplay.classList.add('shake');
  setTimeout(()=>wordDisplay.classList.remove('shake'), 450);
  showWrongFeedback();
}

/* ================================================================
   پنل بازخورد - درست
   ================================================================ */
function showSuccessFeedback(){
  const praise = PRAISES[Math.floor(Math.random() * PRAISES.length)];
  feedbackText.innerHTML = `<div class="feedback-encourage">${praise}</div>`;
  feedbackPanel.classList.remove('show','wrong','success');
  void feedbackPanel.offsetWidth;
  feedbackPanel.classList.add('show','success');
}

/* ================================================================
   پنل بازخورد - اشتباه
   ================================================================ */
function showWrongFeedback(){
  const letter = DB[state.letter].display;
  let posHint = '';
  if(state.form.includes('اول') || state.form === 'اول') posHint = 'در اول کلمه';
  else if(state.form.includes('وسط') || state.form === 'وسط') posHint = 'در وسط کلمه';
  else if(state.form.includes('آخر') || state.form === 'آخر') posHint = 'در آخر کلمه';

  const edu = `دقت کن! حرف «${letter}» ${posHint} قرار داره`;
  const enc = ENCOURAGES[Math.floor(Math.random() * ENCOURAGES.length)];

  feedbackText.innerHTML =
    `<div class="feedback-edu">${edu}</div>` +
    `<div class="feedback-encourage">${enc}</div>`;

  feedbackPanel.classList.remove('show','wrong','success');
  void feedbackPanel.offsetWidth;
  feedbackPanel.classList.add('show','wrong');

  clearTimeout(state.feedbackTimer);
  state.feedbackTimer = setTimeout(hideFeedback, 5000);
}

/* ================================================================
   پنهان کردن پنل بازخورد
   ================================================================ */
function hideFeedback(){
  feedbackPanel.classList.remove('show','wrong','success');
}

/* ================================================================
   هایلایت حرف درست
   ================================================================ */
function highlightFound(idx){
  if(!HAS_HIGHLIGHT) return;
  const textNode = wordDisplay.firstChild;
  if(!textNode) return;
  CSS.highlights.delete('cc' + idx);
  const range = document.createRange();
  range.setStart(textNode, idx);
  range.setEnd(textNode, idx + 1);
  CSS.highlights.set('found', new Highlight(range));
}

function flashWrong(idx){
  if(!HAS_HIGHLIGHT) return;
  const textNode = wordDisplay.firstChild;
  if(!textNode) return;
  const range = document.createRange();
  range.setStart(textNode, idx);
  range.setEnd(textNode, idx + 1);
  CSS.highlights.set('wrongflash', new Highlight(range));
  setTimeout(()=>CSS.highlights.delete('wrongflash'), 400);
}

function showRewardOverlay(){
  rewardOverlay.style.display = 'flex';
  rewardImg.style.display = 'none';
  rewardLoading.style.display = 'block';
  rewardLoading.textContent = '⏳ در حال بارگذاری جایزه...';
  rewardTxt.textContent = '';

  // ابتدا از عکس‌های محلی 1.jpg تا 10.jpg استفاده می‌کنیم
  const num = Math.floor(Math.random() * 10) + 1;
  const sources = [
    num + '.jpg',
    `https://picsum.photos/800/500?random=${Math.floor(Math.random()*100000)}`
  ];

  tryLoadFromSources(sources, 0);
}

function tryLoadFromSources(sources, idx){
  if(idx >= sources.length){
    // همه منابع شکست خوردند - نمایش fallback
    rewardLoading.textContent = '🎉 آفرین! (عکس در دسترس نیست)';
    return;
  }
  const src = sources[idx];
  const test = new Image();

  test.onload = ()=>{
    rewardImg.src = src;
    rewardImg.style.display = 'block';
    rewardLoading.style.display = 'none';
    rewardTxt.textContent = `آفرین ${state.userName}! امتیاز: ${state.score}`;
  };
  test.onerror = ()=>{
    tryLoadFromSources(sources, idx + 1);
  };
  test.src = src;
}

/* ================================================================
   دکمه‌های والد
   ================================================================ */
hintBtn.addEventListener('click',()=>{
  if(!state.letter) return;
  state.hintVisible = !state.hintVisible;
  if(state.hintVisible){
    hintChr.textContent = DB[state.letter].display;
    hintBanner.classList.add('show');
    gameArea.classList.add('shifted');
    hintBtn.textContent = 'پنهان کردن راهنما';
    hintBtn.classList.add('active');
  } else {
    hintBanner.classList.remove('show');
    gameArea.classList.remove('shifted');
    hintBtn.textContent = 'نمایش راهنما';
    hintBtn.classList.remove('active');
  }
});

changeBtn.addEventListener('click',()=>{
  rewardOverlay.style.display = 'none';
  hintBanner.classList.remove('show');
  gameArea.classList.remove('shifted');
  state.hintVisible = false;
  hintBtn.textContent = 'نمایش راهنما';
  hintBtn.classList.remove('active');
  state.isLocked = false;
  clearTimeout(state.feedbackTimer);
  hideFeedback();
  if(HAS_HIGHLIGHT) CSS.highlights.clear();
  selector.style.display = 'flex';
  buildLetterGrid();
  formList.innerHTML = '';
  state.letter = '';
  state.form = '';
  startBtn.disabled = true;
  wordDisplay.textContent = '';
});

backBtn.addEventListener('click',()=>{
  if(window.history.length > 1) window.history.back();
  else window.location.href = '../index.html';
});

nameInput.focus();
</script>
</body>
</html>
