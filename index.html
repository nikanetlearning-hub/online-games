<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پرتابل بازی‌های من</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --danger: #ef4444;
            --border-radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* --- هدر --- */
        header {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding: 0.9rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            gap: 10px;
            flex-wrap: wrap;
        }
        .logo {
            font-size: clamp(1rem, 2.2vw, 1.6rem);
            font-weight: 800;
            color: var(--accent);
            letter-spacing: -0.5px;
        }
        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: clamp(0.75rem, 1.2vw, 0.95rem);
        }
        .user-avatar {
            width: clamp(28px, 3vw, 38px);
            height: clamp(28px, 3vw, 38px);
            border-radius: 50%;
            background: var(--card-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: var(--accent);
            font-size: clamp(0.8rem, 1.2vw, 1rem);
        }
        .logout-btn {
            background: transparent;
            border: 1px solid var(--text-muted);
            color: var(--text-muted);
            padding: 5px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: clamp(0.7rem, 1vw, 0.9rem);
            transition: 0.2s;
        }
        .logout-btn:hover { border-color: var(--danger); color: var(--danger); }

        /* --- محتوا و گرید --- */
        .container {
            padding: clamp(1rem, 2.5vw, 2.5rem);
            max-width: 1700px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
        }
        .page-title {
            font-size: clamp(1.3rem, 2.5vw, 2rem);
            margin-bottom: clamp(1rem, 2vw, 1.8rem);
            font-weight: 700;
            text-align: center;
        }

        /* گرید کاملاً ریسپانسیو:
           - موبایل: 1 تا 2 ستون
           - تبلت: 2 تا 3 ستون
           - لپ‌تاپ: 3 تا 4 ستون
           - تلویزیون: 4 تا 6 ستون (کارت‌های بزرگ)
           همه چیز با auto-fill و minmax خودکار مدیریت می‌شود. */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(clamp(140px, 22vw, 320px), 1fr));
            gap: clamp(0.8rem, 1.8vw, 2rem);
            justify-content: center;
            justify-items: center;
        }

        .game-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1; /* کارت مربعی – در همه دستگاه‌ها متناسب */
            max-width: 340px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            border: 2px solid transparent;
        }
        .game-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 15px 30px rgba(0,0,0,0.45);
            border-color: var(--accent);
        }

        .game-icon {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: clamp(2.5rem, 6vw, 5rem);
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            z-index: 1;
            overflow: hidden;
        }
        .game-icon img {
            width: 100%; height: 100%; object-fit: cover;
        }

        .game-info {
            position: relative;
            z-index: 2;
            background: linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0) 100%);
            padding: clamp(0.6rem, 1.2vw, 1.2rem) 0.8rem clamp(0.6rem, 1vw, 1rem);
            text-align: center;
            pointer-events: none;
        }
        .game-title {
            font-size: clamp(0.85rem, 1.5vw, 1.25rem);
            font-weight: 700;
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* --- مودال خوش‌آمدگویی --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 1rem;
        }
        .welcome-modal {
            background: var(--card-bg);
            border-radius: 24px;
            padding: clamp(1.2rem, 3vw, 2.5rem);
            max-width: min(520px, 92vw);
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255,255,255,0.1);
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .welcome-modal h2 {
            font-size: clamp(1.1rem, 2.5vw, 1.8rem);
            margin-bottom: 1rem;
            color: var(--accent);
        }
        .welcome-modal p {
            color: var(--text-muted);
            line-height: 1.8;
            margin-bottom: clamp(1rem, 2vw, 2rem);
            font-size: clamp(0.8rem, 1.2vw, 1rem);
        }
        .auth-buttons {
            display: flex;
            flex-direction: column;
            gap: clamp(0.6rem, 1vw, 1rem);
        }
        .btn-google {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: white;
            color: #333;
            border: none;
            padding: clamp(8px, 1.2vw, 12px);
            border-radius: 12px;
            font-size: clamp(0.8rem, 1.2vw, 1rem);
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-google:hover { background: #f1f5f9; }
        .btn-google img { width: 24px; height: 24px; }

        .btn-email {
            background: var(--accent);
            color: #0f172a;
            border: none;
            padding: clamp(8px, 1.2vw, 12px);
            border-radius: 12px;
            font-size: clamp(0.8rem, 1.2vw, 1rem);
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-email:hover { background: var(--accent-hover); }

        .btn-guest {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--text-muted);
            padding: clamp(8px, 1.2vw, 12px);
            border-radius: 12px;
            font-size: clamp(0.8rem, 1.2vw, 1rem);
            font-family: inherit;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-guest:hover { color: white; border-color: white; }

        .hidden { display: none !important; }

        /* تنظیمات ویژه تلویزیون: فونت و کارت‌های بزرگ‌تر */
        @media (min-width: 1920px) {
            .games-grid {
                grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
                gap: 2.2rem;
            }
            .game-card { max-width: 400px; }
        }
    </style>
</head>
<body>

    <!-- هدر -->
    <header id="mainHeader" class="hidden">
        <div class="logo">🎮 GamePortal</div>
        <div class="user-profile" id="userProfile" style="display: none;">
            <div class="user-avatar" id="userAvatar">U</div>
            <span id="userName">کاربر مهمان</span>
            <button class="logout-btn" onclick="logout()">خروج</button>
        </div>
    </header>

    <!-- محتوای اصلی -->
    <main class="container hidden" id="mainContent">
        <h1 class="page-title">بازی‌های من</h1>
        <div class="games-grid" id="gamesGrid"></div>
    </main>

    <!-- مودال خوش‌آمدگویی -->
    <div class="modal-overlay" id="welcomeModal">
        <div class="welcome-modal">
            <h2>به پرتابل بازی خوش آمدی! 👋</h2>
            <p>
                اگر می‌خواهی تمام امتیازات، رکوردها و تاریخچه‌ی بازی‌هایت ذخیره شود و در هر دستگاهی به آن‌ها دسترسی داشته باشی، همین حالا ثبت‌نام کن.
                <br>
                <strong>نگران نباش، ورود با گوگل فقط چند ثانیه طول می‌کشد.</strong>
            </p>
            <div class="auth-buttons">
                <button class="btn-google" onclick="handleGoogleLogin(event)">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                    ورود با گوگل
                </button>
                <button class="btn-email" onclick="alert('فرم ثبت‌نام با ایمیل (به زودی)')">
                    ثبت‌نام با ایمیل
                </button>
                <button class="btn-guest" onclick="continueAsGuest()">
                    ادامه بدون ثبت‌نام (مهمان)
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- ۱. داده‌های بازی‌ها ---
        // بازی اول در پوشه alphabet_learning است.
     
		const games = [
    { id: 'game1', title: 'بازی ۱ - الفبای فارسی', icon: '🔤', link: 'shell.html?game=alphabet' },
    { id: 'game2', title: 'بازی ۲ - اعداد فارسی و انگلیسی', icon: '🔢', link: 'shell.html?game=number' },
    { id: 'game3', title: 'بازی ۳', icon: '🏆', link: '#' },
    // ...
];

        // --- ۲. ساخت کارت‌های بازی ---
        function renderGames() {
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = '';

            games.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `
                    <div class="game-icon">${game.icon}</div>
                    <div class="game-info">
                        <div class="game-title">${game.title}</div>
                    </div>
                `;

                card.addEventListener('click', () => {
                    if (game.link && game.link !== '#') {
                        window.location.href = game.link;
                    } else {
                        alert(`بازی «${game.title}» هنوز آماده نیست.`);
                    }
                });

                grid.appendChild(card);
            });
        }

        // --- ۳. منطق احراز هویت (شبیه‌سازی شده) ---
        function saveUser(user) {
            localStorage.setItem('gamePortalUser', JSON.stringify(user));
            updateUIForUser(user);
        }

        function updateUIForUser(user) {
            document.getElementById('welcomeModal').classList.add('hidden');
            document.getElementById('mainHeader').classList.remove('hidden');
            document.getElementById('mainContent').classList.remove('hidden');

            const profileDiv = document.getElementById('userProfile');
            const avatar = document.getElementById('userAvatar');
            const nameSpan = document.getElementById('userName');

            profileDiv.style.display = 'flex';

            if (user.type === 'google') {
                avatar.textContent = user.name.charAt(0).toUpperCase();
                avatar.style.background = '#38bdf8';
                avatar.style.color = '#0f172a';
                nameSpan.textContent = user.name;
            } else if (user.type === 'guest') {
                avatar.textContent = '👤';
                nameSpan.textContent = 'مهمان';
            }
        }

        function handleGoogleLogin(event) {
            const mockUser = {
                type: 'google',
                name: 'کاربر گوگل',
                email: 'user@gmail.com',
                uid: 'google_' + Math.random().toString(36).substr(2, 9),
                photoURL: null
            };

            const btn = event.target.closest('button');
            const originalText = btn.innerHTML;
            btn.innerHTML = 'در حال اتصال...';
            btn.disabled = true;

            setTimeout(() => {
                saveUser(mockUser);
                btn.innerHTML = originalText;
                btn.disabled = false;
            }, 800);
        }

        function continueAsGuest() {
            const guestUser = {
                type: 'guest',
                name: 'مهمان',
                uid: 'guest_' + Math.random().toString(36).substr(2, 9)
            };
            saveUser(guestUser);
        }

        function logout() {
            localStorage.removeItem('gamePortalUser');
            document.getElementById('welcomeModal').classList.remove('hidden');
            document.getElementById('mainHeader').classList.add('hidden');
            document.getElementById('mainContent').classList.add('hidden');
            document.getElementById('userProfile').style.display = 'none';
        }

        // --- ۴. مقداردهی اولیه ---
        document.addEventListener('DOMContentLoaded', () => {
            renderGames();

            const savedUser = localStorage.getItem('gamePortalUser');
            if (savedUser) {
                try {
                    const user = JSON.parse(savedUser);
                    updateUIForUser(user);
                } catch (e) {
                    localStorage.removeItem('gamePortalUser');
                }
            }
        });
    </script>
</body>
</html>
